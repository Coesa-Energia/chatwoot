# #
# # COESA: builds the production image once and pushes it to GHCR.
# # Railway's web and worker services both run the same tag (the commit SHA),
# # so they are always on the same version and a deploy is only an image pull.
# #

name: Publish COESA production image

on:
  push:
    branches:
      - coesa/producao
  workflow_dispatch:

env:
  IMAGE: ghcr.io/coesa-energia/chatwoot

permissions:
  contents: read
  packages: write

concurrency:
  group: coesa-publish-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:producao
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Imagem publicada: \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
